# Creates a v* git tag from VERSION for go get / pkg.go.dev.
#
# Permissions: contents: write (to push tags)

name: Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Tag release for Go modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Tag if new version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          git config user.name "mailofly-bot"
          git config user.email "bot@mailofly.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG"
